<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Media Cast remote</title>
    <!-- Served to phones by RemoteServer: everything comes from the same origin.
         media-src blob: is the silent clip behind the media notification (mediaSession.ts). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/remote/main.tsx"></script>
  </body>
</html>
