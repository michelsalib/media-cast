name: Build/release Electron app

permissions:
  contents: write

on:
  push:
    tags:
      - v*.*.*

env:
  TAG: ${{ github.ref_name }}

jobs:
  # electron-builder's GitHub publisher races with itself when no release exists yet
  # (a single job created two v2.0.0 releases). Creating the draft up front means every
  # upload from every job lands in the same release; `publish` flips it live at the end.
  prepare:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Create draft release
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --title "$TAG" --notes ""

  release:
    needs: prepare
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os:
          - macos-latest
          - windows-latest

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      # Node still runs Electron's tooling (electron-vite, electron-builder); bun is
      # the package manager and script runner.
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Download bundled ffmpeg / ffprobe
        run: bun run prepare:binaries

      - name: build-mac
        if: matrix.os == 'macos-latest'
        run: bun run build:mac

      - name: build-win
        if: matrix.os == 'windows-latest'
        run: bun run build:win

  publish:
    needs: release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # Tags with a prerelease suffix (v2.0.0-alpha.0) become GitHub pre-releases, so stable
      # installs (electron-updater follows /releases/latest) never auto-update to them.
      - name: Publish release
        run: |
          if [[ "$TAG" == *-* ]]; then PRE=--prerelease; else PRE=--prerelease=false; fi
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false $PRE

      # micheldev.com/media-cast links its download buttons to this release's installers: a
      # dispatch makes it rebuild now rather than at its weekly run. Only once published, since
      # the site reads /releases/latest, and never for a pre-release, which that skips anyway.
      # SITE_DISPATCH_TOKEN can only write to michelsalib/micheldev.com.
      - name: Rebuild micheldev.com/media-cast
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::SITE_DISPATCH_TOKEN is not set: micheldev.com/media-cast updates at its weekly rebuild"
            exit 0
          fi
          gh api repos/michelsalib/micheldev.com/dispatches -f event_type=project-released -f "client_payload[project]=media-cast"
