name: Build/release Electron app

permissions:
  contents: write

on:
  push:
    tags:
      - v*.*.*

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os:
          # Ubuntu needs snapcraft, commenting for now
          # - ubuntu-latest
          - macos-latest
          - windows-latest

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Tags with a prerelease suffix (v2.0.0-alpha.0) publish as GitHub pre-releases, so
      # stable installs (electron-updater follows /releases/latest) never auto-update to them.
      EP_PRE_RELEASE: ${{ contains(github.ref_name, '-') }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      # Node still runs Electron's tooling (electron-vite, electron-builder); bun is
      # the package manager and script runner.
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Download bundled ffmpeg / ffprobe
        run: bun run prepare:binaries

      - name: build-linux
        if: matrix.os == 'ubuntu-latest'
        run: bun run build:linux

      - name: build-mac
        if: matrix.os == 'macos-latest'
        run: bun run build:mac

      - name: build-win
        if: matrix.os == 'windows-latest'
        run: bun run build:win
